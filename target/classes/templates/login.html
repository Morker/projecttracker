<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign in — DevTrack</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="login-page">
<div class="login-box">
    <div class="login-logo">⬡ DevTrack</div>
    <p class="login-sub">Your coding projects, documented.</p>

    <div th:if="${param.error}" class="alert alert-error">
        Invalid username or password.
    </div>
    <div th:if="${param.logout}" class="alert alert-info">
        You've been signed out.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus autocomplete="username"/>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password"/>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign in</button>
    </form>
</div>
</body>
</html>
