<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Log Entry — DevTrack</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<th:block th:replace="~{layout/base :: sidebar('projects')}"/>

<div class="app-layout">
    <div class="topbar">
        <div class="topbar-left">
            <button class="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">&#9776;</button>
            <nav class="breadcrumb">
                <a th:href="@{/projects}">Projects</a>
                <span class="breadcrumb-sep">/</span>
                <a th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.name}">Project</a>
                <span class="breadcrumb-sep">/</span>
                <span>New Log Entry</span>
            </nav>
        </div>
    </div>
    <div class="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('open')"></div>

    <div class="content">
        <h1>Add Log Entry</h1>
        <p class="form-hint">What did you work on? What did you learn? What's next?</p>

        <form th:action="@{/projects/{id}/logs/save(id=${project.id})}"
              th:object="${logEntry}" method="post" class="form-card">

            <div class="field">
                <label for="entryDate">Date</label>
                <input type="date" id="entryDate" th:field="*{entryDate}"/>
            </div>

            <div class="field">
                <label for="note">Note *</label>
                <textarea id="note" th:field="*{note}" rows="5"
                          placeholder="e.g. Set up Flyway migrations and created initial schema. Fixed N+1 query issue in project list."></textarea>
                <span th:if="${#fields.hasErrors('note')}" th:errors="*{note}" class="field-error"/>
            </div>

            <div class="form-actions">
                <a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Entry</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
