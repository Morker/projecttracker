<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' — DevTrack' : 'DevTrack'}">DevTrack</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<nav class="navbar">
    <a th:href="@{/}" class="nav-brand">⬡ DevTrack</a>
    <div class="nav-links">
        <a th:href="@{/projects}" th:classappend="${#httpServletRequest.requestURI.contains('/projects')} ? 'active'">Projects</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-link" sec:authentication="name">Sign out</button>
        </form>
    </div>
</nav>

<main class="container" th:fragment="content">
    <!-- page content here -->
</main>

</body>
</html>
