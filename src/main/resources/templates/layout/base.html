<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>DevTrack</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<!-- Sidebar fragment: reuse across all pages via th:replace -->
<aside class="sidebar" id="sidebar" th:fragment="sidebar(activeMenu)">
    <a th:href="@{/}" class="sidebar-brand">
        <span class="sidebar-brand-icon">&#x2B21;</span>
        <span class="sidebar-brand-text">DevTrack</span>
    </a>
    <nav class="sidebar-nav">
        <a th:href="@{/}" class="sidebar-link" th:classappend="${activeMenu == 'dashboard'} ? 'active'">
            <span class="sidebar-link-icon">&#8962;</span>
            <span class="sidebar-link-text">Dashboard</span>
        </a>
        <a th:href="@{/projects}" class="sidebar-link" th:classappend="${activeMenu == 'projects'} ? 'active'">
            <span class="sidebar-link-icon">&#9776;</span>
            <span class="sidebar-link-text">Projects</span>
        </a>
        <div class="sidebar-spacer"></div>
    </nav>
    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post" style="display:block">
            <button type="submit" class="btn-link sidebar-link">
                <span class="sidebar-link-icon">&#9211;</span>
                <span class="sidebar-link-text">Sign out</span>
            </button>
        </form>
    </div>
</aside>

</body>
</html>
