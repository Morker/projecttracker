<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard — DevTrack</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<nav class="navbar">
    <a th:href="@{/}" class="nav-brand">⬡ DevTrack</a>
    <div class="nav-links">
        <a th:href="@{/projects}">Projects</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-link">Sign out</button>
        </form>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <h1>Dashboard</h1>
        <a th:href="@{/projects/new}" class="btn btn-primary">+ New Project</a>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-num" th:text="${stats.total}">0</span>
            <span class="stat-label">Total Projects</span>
        </div>
        <div class="stat-card accent-blue">
            <span class="stat-num" th:text="${stats.inProgress}">0</span>
            <span class="stat-label">In Progress</span>
        </div>
        <div class="stat-card accent-green">
            <span class="stat-num" th:text="${stats.done}">0</span>
            <span class="stat-label">Completed</span>
        </div>
        <div class="stat-card accent-yellow">
            <span class="stat-num" th:text="${stats.ideas}">0</span>
            <span class="stat-label">Ideas</span>
        </div>
    </div>

    <div class="two-col">
        <!-- Recent projects -->
        <section>
            <div class="section-header">
                <h2>Recent Projects</h2>
                <a th:href="@{/projects}" class="link-small">View all →</a>
            </div>
            <div th:if="${#lists.isEmpty(recentProjects)}" class="empty-state">
                <p>No projects yet. <a th:href="@{/projects/new}">Create your first one.</a></p>
            </div>
            <div class="project-list" th:unless="${#lists.isEmpty(recentProjects)}">
                <a th:each="p : ${recentProjects}"
                   th:href="@{/projects/{id}(id=${p.id})}"
                   class="project-row">
                    <div>
                        <span class="project-name" th:text="${p.name}">Project</span>
                        <span th:each="t : ${p.techStackList}" class="tag" th:text="${t}">tag</span>
                    </div>
                    <span class="badge" th:classappend="'badge-' + ${p.status.name().toLowerCase()}"
                          th:text="${p.status.label}">Status</span>
                </a>
            </div>
        </section>

        <!-- Recent dev logs -->
        <section>
            <div class="section-header">
                <h2>Recent Logs</h2>
            </div>
            <div th:if="${#lists.isEmpty(recentLogs)}" class="empty-state">
                <p>No log entries yet. Start documenting your progress.</p>
            </div>
            <ul class="log-list" th:unless="${#lists.isEmpty(recentLogs)}">
                <li th:each="log : ${recentLogs}" class="log-item">
                    <span class="log-date" th:text="${#temporals.format(log.entryDate, 'dd MMM')}">01 Jan</span>
                    <span class="log-note" th:text="${log.note}">note</span>
                    <a th:href="@{/projects/{id}(id=${log.project.id})}"
                       class="log-project" th:text="${log.project.name}">project</a>
                </li>
            </ul>
        </section>
    </div>
</main>
</body>
</html>
